[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    ".agents",
    ".claude",
    "data",
    "staticfiles",
    "__pycache__",
    "*.md",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
docstring-code-format = false
exclude = [
    "planner/corridor.py",
    "routing/errors.py",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "^\\.venv/",
    "^\\.agents/",
    "^\\.claude/",
]

[[tool.mypy.overrides]]
module = [
    "planner.*",
    "routing.*",
    "stations.services.*",
]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
